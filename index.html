<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
            background-color: #000;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            display: none;
        }
        
        #character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .character-cell {
            position: relative;
            border: 3px solid #39FF14;
            border-radius: 4px;
            background-color: #111;
            overflow: hidden;
        }
        
        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: #39FF14;
            padding: 3px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #character-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <div id="character-grid"></div>
        <canvas id="character-canvas"></canvas>
        <div class="credit">Images generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const characterGrid = document.getElementById('character-grid');
            const canvas = document.getElementById('character-canvas');
            const ctx = canvas.getContext('2d');

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

Most importantly:
- NO HEADER TEXT or TITLE anywhere in the image
- ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
- The character portraits should be arranged in a perfect 4x4 grid
- The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
- Include ONLY the character selection grid - no other UI elements, no logos, no text
- Each square should contain a character portrait showing their face/upper body
- Simple dark background behind the character grid
- Only show the 16 characters mentioned in the specification below

${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Display the generated image
                characterSelectScreen.src = result.url;
                
                characterSelectScreen.onload = async () => {
                    loadingIndicator.querySelector('.loading-text').textContent = "Analyzing character positions...";
                    
                    // Set canvas dimensions to match the image
                    canvas.width = characterSelectScreen.naturalWidth;
                    canvas.height = characterSelectScreen.naturalHeight;
                    
                    // Draw the image on the canvas
                    ctx.drawImage(characterSelectScreen, 0, 0);
                    
                    // Convert canvas to data URL for sending to LLM
                    const imageDataUrl = canvas.toDataURL('image/jpeg');
                    
                    // Ask LLM to analyze the image and determine grid coordinates
                    try {
                        const completion = await websim.chat.completions.create({
                            messages: [
                                {
                                    role: "user",
                                    content: [
                                        {
                                            type: "text",
                                            text: `Analyze this Street Fighter character selection screen. It shows a 4x4 grid of characters.
                                            
For each of the 16 character cells, provide the exact coordinates (x, y, width, height) for cropping each character portrait from the main image.

The characters are:
Row 1: Ryu, Ken, Chun-Li, Guile
Row 2: E. Honda, Blanka, Zangief, Dhalsim
Row 3: Balrog, Vega, Sagat, M. Bison
Row 4: Akuma, Cammy, Fei Long, T. Hawk

Return just the JSON array of crop coordinates. For example:
[
  {"name": "Ryu", "x": 10, "y": 10, "width": 100, "height": 100},
  {"name": "Ken", "x": 120, "y": 10, "width": 100, "height": 100},
  ...and so on for all 16 characters
]

The coordinates should be precise to allow clean cropping of each character from the portrait.`,
                                        },
                                        {
                                            type: "image_url",
                                            image_url: { url: imageDataUrl },
                                        },
                                    ],
                                },
                            ],
                            json: true,
                        });

                        const cropCoordinates = JSON.parse(completion.content);
                        loadingIndicator.querySelector('.loading-text').textContent = "Cropping character portraits...";
                        
                        // Crop and display each character
                        for (const character of cropCoordinates) {
                            // Create a character cell div
                            const cell = document.createElement('div');
                            cell.className = 'character-cell';
                            
                            // Crop the character from the main image
                            const characterImg = document.createElement('img');
                            
                            // Create a temporary canvas for cropping
                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = character.width;
                            tempCanvas.height = character.height;
                            const tempCtx = tempCanvas.getContext('2d');
                            
                            // Draw the cropped portion to the temp canvas
                            tempCtx.drawImage(
                                characterSelectScreen, 
                                character.x, character.y, character.width, character.height,
                                0, 0, character.width, character.height
                            );
                            
                            // Set the cropped image as src
                            characterImg.src = tempCanvas.toDataURL();
                            characterImg.className = 'character-image';
                            characterImg.alt = character.name;
                            
                            // Add name label
                            const nameLabel = document.createElement('div');
                            nameLabel.className = 'character-name';
                            nameLabel.textContent = character.name;
                            
                            // Add to cell and grid
                            cell.appendChild(characterImg);
                            cell.appendChild(nameLabel);
                            characterGrid.appendChild(cell);
                        }
                        
                        // Hide loading indicator and show grid
                        loadingIndicator.style.display = 'none';
                    } catch (error) {
                        console.error('Error analyzing image:', error);
                        loadingIndicator.innerHTML = `<div>Error analyzing character positions. Please refresh the page.</div>`;
                    }
                };
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
            }
        });
    </script>

</body>
</html>
