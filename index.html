<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
            background-color: #000;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            display: none;
        }
        
        #character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .character-cell {
            position: relative;
            border: 3px solid #39FF14;
            border-radius: 4px;
            background-color: #111;
            overflow: hidden;
        }
        
        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: #39FF14;
            padding: 3px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #character-canvas {
            display: none;
        }
        
        /* Add error message styling */
        .error-message {
            color: red;
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid red;
            border-radius: 5px;
            margin: 20px;
        }
        
        /* Add retry button styling */
        .retry-button {
            padding: 10px 20px;
            background-color: #39FF14;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .retry-button:hover {
            background-color: #2ce00f;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <div id="character-grid"></div>
        <canvas id="character-canvas"></canvas>
        <!-- Container for cropped character images -->
        <div id="cropped-container" style="display:none;"></div>
        <div class="credit">Images generated by AI</div>
        <!-- Hidden canvas for OpenCV processing -->
        <canvas id="opencv-canvas" style="display:none;"></canvas>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Wait for OpenCV to initialize, then kick off the image generation & detection
            const onOpenCvReady = new Promise(resolve => {
                if (cv && cv.Mat) resolve();
                else cv['onRuntimeInitialized'] = () => resolve();
            });
            onOpenCvReady.then(generateAndProcessImage);
        });

        // Function to show error with retry button
        function showError(message, retryFunction) {
            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.innerHTML = `
                <div class="error-message">${message}</div>
                ${retryFunction ? '<button class="retry-button">Retry</button>' : ''}
            `;
            
            if (retryFunction) {
                const retryButton = loadingIndicator.querySelector('.retry-button');
                retryButton.addEventListener('click', () => {
                    loadingIndicator.innerHTML = `
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Retrying...</div>
                    `;
                    setTimeout(retryFunction, 500);
                });
            }
        }

        // Main function to generate image and process characters
        async function generateAndProcessImage() {
            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

                Most importantly:
                - NO HEADER TEXT or TITLE anywhere in the image
                - ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
                - The character portraits should be arranged in a perfect 4x4 grid
                - The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
                - Include ONLY the character selection grid - no other UI elements, no logos, no text
                - Each square should contain a character portrait showing their face/upper body
                - Simple dark background behind the character grid
                - Only show the 16 characters mentioned in the specification below

                ${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                const loadingIndicator = document.getElementById('loading');
                loadingIndicator.querySelector('.loading-text').textContent = "Generating character selection screen...";
                
                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Store the image URL and run the OpenCV-based detector & cropper
                const imageUrl = result.url;
                await detectAndCropCharacters(imageUrl);
            } catch (error) {
                console.error('Error generating image:', error);
                showError(`Error generating image: ${error.message}`, generateAndProcessImage);
            }
        }

        /**
         * Uses OpenCV.js to find the neon-green (#39FF14) boxes in the generated image,
         * crops each one out, and renders them in #cropped-container.
         */
        async function detectAndCropCharacters(imageUrl) {
            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.querySelector('.loading-text').textContent = "Detecting character portraits...";
            // load image
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = imageUrl;
            await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });

            // draw into hidden canvas for OpenCV
            const opencvCanvas = document.getElementById('opencv-canvas');
            opencvCanvas.width = img.width; opencvCanvas.height = img.height;
            const octx = opencvCanvas.getContext('2d');
            octx.drawImage(img, 0, 0);

            // prepare mats
            let src = cv.imread(opencvCanvas);
            let hsv = new cv.Mat();
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            // threshold for neon-green
            let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [50,200,50,0]);
            let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90,255,255,255]);
            let mask = new cv.Mat();
            cv.inRange(hsv, low, high, mask);
            // close gaps
            let kernel = cv.Mat.ones(3,3,cv.CV_8U);
            cv.dilate(mask, mask, kernel);

            // find contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            const rects = [];
            for (let i=0; i<contours.size(); i++) {
                const cnt = contours.get(i);
                const r = cv.boundingRect(cnt);
                // filter by size & aspect ratio
                if (r.width > img.width*0.1 && r.height > img.height*0.1 &&
                    r.width < img.width*0.6 && r.height < img.height*0.6) {
                    const ar = r.width/r.height;
                    if (ar > 0.5 && ar < 2) rects.push(r);
                }
                cnt.delete();
            }
            // cleanup mats
            src.delete(); hsv.delete(); low.delete(); high.delete();
            mask.delete(); kernel.delete(); contours.delete(); hierarchy.delete();

            // if we didn't find exactly 16, fallback to uniform grid
            let boxes = rects;
            if (boxes.length !== 16) {
                console.warn(`Found ${boxes.length} boxes; using uniform grid fallback.`);
                boxes = [];
                const cols=4, rows=4;
                for (let ry=0; ry<rows; ry++){
                    for (let cx=0; cx<cols; cx++){
                        boxes.push({
                            x: Math.round(cx*(img.width/cols)),
                            y: Math.round(ry*(img.height/rows)),
                            width: Math.round(img.width/cols),
                            height: Math.round(img.height/rows)
                        });
                    }
                }
            }
            // sort top→bottom, left→right
            boxes.sort((a,b)=>{
                if (Math.abs(a.y-b.y) > img.height/8) return a.y-b.y;
                return a.x-b.x;
            });

            // crop & render
            const container = document.getElementById('cropped-container');
            container.innerHTML = "";
            Object.assign(container.style, { display:"flex", flexWrap:"wrap", justifyContent:"center" });
            const cropCanvas = document.createElement('canvas');
            const cropCtx = cropCanvas.getContext('2d');
            const names = characterSelectionTemplate.characters.map(c=>c.name);
            boxes.forEach((b, idx) => {
                cropCanvas.width = b.width; cropCanvas.height = b.height;
                cropCtx.clearRect(0,0,b.width,b.height);
                cropCtx.drawImage(img, b.x,b.y,b.width,b.height, 0,0,b.width,b.height);
                const dataUrl = cropCanvas.toDataURL();

                const card = document.createElement('div');
                Object.assign(card.style, { display:"flex", flexDirection:"column", alignItems:"center", margin:"5px" });
                const imgEl = document.createElement('img');
                imgEl.src = dataUrl;
                imgEl.alt = names[idx]||"";
                Object.assign(imgEl.style, { width:"100px", height:"100px", objectFit:"cover", border:"3px solid #39FF14", borderRadius:"4px" });
                const label = document.createElement('div');
                label.textContent = names[idx]||"";
                Object.assign(label.style, { color:"#39FF14", fontSize:"12px", textTransform:"uppercase", marginTop:"5px" });
                card.append(imgEl, label);
                container.appendChild(card);
            });

            // hide original UI
            loadingIndicator.style.display = "none";
            document.getElementById('character-select-screen').style.display = "none";
            document.getElementById('character-grid').style.display = "none";
        }
    </script>
