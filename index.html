<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
            background-color: #000;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            opacity: 0; /* Hide original image after processing */
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }

        /* Character grid styles */
        #character-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
            box-sizing: border-box;
        }

        .character-cell {
            position: relative;
            border: 3px solid #39FF14;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .character-cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #39FF14;
            z-index: 5;
        }

        .character-cell.selected {
            box-shadow: 0 0 20px #39FF14, 0 0 40px #39FF14;
            z-index: 10;
        }

        .character-portrait {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 3px 0;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Character detail panel */
        #character-detail {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            padding: 0 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 15;
        }

        #character-detail.visible {
            transform: translateY(0);
        }

        .detail-portrait {
            width: 70px;
            height: 70px;
            border: 2px solid #39FF14;
            background-size: cover;
            background-position: center;
        }

        .detail-info {
            margin-left: 15px;
            flex-grow: 1;
        }

        .detail-name {
            font-size: 18px;
            font-weight: bold;
            color: #39FF14;
        }

        .detail-country {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Processing canvas for image detection */
        #processingCanvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <canvas id="processingCanvas"></canvas>
        <div id="character-grid"></div>
        <div id="character-detail">
            <div class="detail-portrait"></div>
            <div class="detail-info">
                <div class="detail-name"></div>
                <div class="detail-country"></div>
            </div>
        </div>
        <div class="credit">Image generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const characterGrid = document.getElementById('character-grid');
            const characterDetail = document.getElementById('character-detail');
            const detailPortrait = document.querySelector('.detail-portrait');
            const detailName = document.querySelector('.detail-name');
            const detailCountry = document.querySelector('.detail-country');
            const processingCanvas = document.getElementById('processingCanvas');
            const ctx = processingCanvas.getContext('2d');

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

Most importantly:
- ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
- The character portraits should be arranged in a perfect 4x4 grid
- The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
- Include ONLY the character selection grid - no other UI elements, no logos, no text
- Each square should contain a character portrait showing their face/upper body
- Simple dark background behind the character grid
- Only show the 16 characters mentioned in the specification below

${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Display the generated image
                characterSelectScreen.src = result.url;
                
                characterSelectScreen.onload = () => {
                    // After the image is loaded, process it to detect character squares
                    setTimeout(() => {
                        processImage(characterSelectScreen);
                    }, 500);
                };
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
            }

            // Function to detect character portraits and create individual cells
            function processImage(img) {
                // Setup canvas for image processing
                processingCanvas.width = img.naturalWidth;
                processingCanvas.height = img.naturalHeight;
                ctx.drawImage(img, 0, 0);
                
                // Get image data for pixel-level analysis
                const imageData = ctx.getImageData(0, 0, processingCanvas.width, processingCanvas.height);
                const data = imageData.data;
                
                // Define the target color (#39FF14 - neon green)
                const targetColor = {
                    r: 57,   // 0x39
                    g: 255,  // 0xFF
                    b: 20    // 0x14
                };
                
                // Color matching tolerance (0-255, higher = more lenient)
                const tolerance = 30;
                
                // Function to check if a pixel is close to the target color
                function isTargetColor(r, g, b) {
                    return Math.abs(r - targetColor.r) < tolerance &&
                           Math.abs(g - targetColor.g) < tolerance && 
                           Math.abs(b - targetColor.b) < tolerance;
                }
                
                // Scan the image to find potential character cells by detecting green outlines
                // First, create a heatmap of target color presence
                const width = processingCanvas.width;
                const height = processingCanvas.height;
                const heatmap = new Array(width * height).fill(0);
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        
                        if (isTargetColor(r, g, b)) {
                            heatmap[y * width + x] = 1;
                        }
                    }
                }
                
                // Use heatmap to identify connected regions of green (cell outlines)
                const cellRegions = [];
                
                // Simplified detection for a 4x4 grid
                // Divide the image into regions and look for concentrations of the target color
                const gridRows = 4;
                const gridCols = 4;
                const cellWidth = Math.floor(width / gridCols);
                const cellHeight = Math.floor(height / gridRows);
                
                // For visual debugging
                ctx.strokeStyle = "red";
                ctx.lineWidth = 3;
                
                for (let row = 0; row < gridRows; row++) {
                    for (let col = 0; col < gridCols; col++) {
                        // Base region for this cell
                        const cellX = col * cellWidth;
                        const cellY = row * cellHeight;
                        
                        // Find the actual borders of the cell by detecting the green outline
                        let minX = cellX + cellWidth;
                        let minY = cellY + cellHeight;
                        let maxX = cellX;
                        let maxY = cellY;
                        let greenPixelCount = 0;
                        
                        // Scan this region to find the boundaries of the green outline
                        for (let y = Math.max(0, cellY - 10); y < Math.min(height, cellY + cellHeight + 10); y++) {
                            for (let x = Math.max(0, cellX - 10); x < Math.min(width, cellX + cellWidth + 10); x++) {
                                const idx = (y * width + x) * 4;
                                const r = data[idx];
                                const g = data[idx + 1];
                                const b = data[idx + 2];
                                
                                if (isTargetColor(r, g, b)) {
                                    greenPixelCount++;
                                    minX = Math.min(minX, x);
                                    minY = Math.min(minY, y);
                                    maxX = Math.max(maxX, x);
                                    maxY = Math.max(maxY, y);
                                }
                            }
                        }
                        
                        // Ensure minimum green pixels to be considered a valid cell
                        // and ensure a minimum interior area
                        if (greenPixelCount > 100 && 
                            (maxX - minX) > 30 && 
                            (maxY - minY) > 30) {
                            
                            // Expand the cell bounds slightly to ensure we get the complete border
                            minX = Math.max(0, minX - 3);
                            minY = Math.max(0, minY - 3);
                            maxX = Math.min(width, maxX + 3);
                            maxY = Math.min(height, maxY + 3);
                            
                            // Add padding inside to avoid the border
                            const innerPadding = 5;
                            const innerMinX = minX + innerPadding;
                            const innerMinY = minY + innerPadding;
                            const innerMaxX = maxX - innerPadding;
                            const innerMaxY = maxY - innerPadding;
                            
                            // Check that the inner area is at least 25x25px
                            if ((innerMaxX - innerMinX) >= 25 && (innerMaxY - innerMinY) >= 25) {
                                cellRegions.push({
                                    x: minX,
                                    y: minY,
                                    width: maxX - minX,
                                    height: maxY - minY,
                                    index: row * gridCols + col
                                });
                                
                                // Draw detection rectangles for debugging (will be hidden)
                                ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
                            }
                        }
                    }
                }
                
                // Create individual cells for each character
                characterGrid.innerHTML = '';
                const characters = characterSelectionTemplate.characters;
                
                // Use the detected regions to create character cells
                cellRegions.forEach(region => {
                    const index = region.index;
                    const character = characters[index];
                    
                    if (!character) return; // Skip if invalid index
                    
                    // Create a div for this character
                    const cell = document.createElement('div');
                    cell.className = 'character-cell';
                    cell.setAttribute('data-index', index);
                    
                    // Create elements for portrait and name
                    const portrait = document.createElement('div');
                    portrait.className = 'character-portrait';
                    
                    // Calculate crop and positioning values
                    portrait.style.backgroundImage = `url(${img.src})`;
                    
                    // Calculate the background position to show just this cell's portion
                    const bgPosX = -(region.x / img.naturalWidth * 100);
                    const bgPosY = -(region.y / img.naturalHeight * 100);
                    const bgSizeX = (img.naturalWidth / region.width * 100);
                    const bgSizeY = (img.naturalHeight / region.height * 100);
                    
                    portrait.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                    portrait.style.backgroundSize = `${bgSizeX}% ${bgSizeY}%`;
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'character-name';
                    nameDiv.textContent = character.name;
                    
                    // Add elements to the cell
                    cell.appendChild(portrait);
                    cell.appendChild(nameDiv);
                    
                    // Add click handler
                    cell.addEventListener('click', () => {
                        // Remove selected class from all cells
                        document.querySelectorAll('.character-cell').forEach(c => {
                            c.classList.remove('selected');
                        });
                        
                        // Add selected class to this cell
                        cell.classList.add('selected');
                        
                        // Update character detail panel
                        detailPortrait.style.backgroundImage = portrait.style.backgroundImage;
                        detailPortrait.style.backgroundPosition = portrait.style.backgroundPosition;
                        detailPortrait.style.backgroundSize = portrait.style.backgroundSize;
                        detailName.textContent = character.name;
                        detailCountry.textContent = character.country;
                        
                        // Show the detail panel
                        characterDetail.classList.add('visible');
                    });
                    
                    characterGrid.appendChild(cell);
                });
                
                // If we didn't find all the cells, fall back to grid-based division
                if (cellRegions.length < 16) {
                    console.warn(`Only detected ${cellRegions.length} cells, falling back to grid-based division`);
                    fallbackGridDetection(img);
                } else {
                    // Hide loading indicator after grid creation
                    loadingIndicator.style.display = 'none';
                }
            }
            
            // Fallback to grid-based division if detection fails
            function fallbackGridDetection(img) {
                console.log("Using fallback grid detection");
                // Calculate dimensions for a 4x4 grid
                const gridColumns = 4;
                const gridRows = 4;
                
                // Use the full image area with small margins
                const marginPercent = 0.05;
                const gridWidth = img.naturalWidth * (1 - 2 * marginPercent);
                const gridHeight = img.naturalHeight * (1 - 2 * marginPercent);
                const startX = img.naturalWidth * marginPercent;
                const startY = img.naturalHeight * marginPercent;
                
                // Calculate cell dimensions
                const cellWidth = gridWidth / gridColumns;
                const cellHeight = gridHeight / gridRows;
                
                // Create individual cells for each character
                characterGrid.innerHTML = '';
                const characters = characterSelectionTemplate.characters;
                
                for (let row = 0; row < gridRows; row++) {
                    for (let col = 0; col < gridColumns; col++) {
                        const index = row * gridColumns + col;
                        const character = characters[index];
                        
                        // Calculate position for this cell in the original image
                        const x = startX + col * cellWidth;
                        const y = startY + row * cellHeight;
                        
                        // Create cell elements as before
                        const cell = document.createElement('div');
                        cell.className = 'character-cell';
                        cell.setAttribute('data-index', index);
                        
                        const portrait = document.createElement('div');
                        portrait.className = 'character-portrait';
                        portrait.style.backgroundImage = `url(${img.src})`;
                        
                        const bgPosX = -(x / img.naturalWidth * 100);
                        const bgPosY = -(y / img.naturalHeight * 100);
                        const bgSizeX = (img.naturalWidth / cellWidth * 100);
                        const bgSizeY = (img.naturalHeight / cellHeight * 100);
                        
                        portrait.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                        portrait.style.backgroundSize = `${bgSizeX}% ${bgSizeY}%`;
                        
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'character-name';
                        nameDiv.textContent = character.name;
                        
                        cell.appendChild(portrait);
                        cell.appendChild(nameDiv);
                        
                        cell.addEventListener('click', () => {
                            document.querySelectorAll('.character-cell').forEach(c => {
                                c.classList.remove('selected');
                            });
                            
                            cell.classList.add('selected');
                            
                            detailPortrait.style.backgroundImage = portrait.style.backgroundImage;
                            detailPortrait.style.backgroundPosition = portrait.style.backgroundPosition;
                            detailPortrait.style.backgroundSize = portrait.style.backgroundSize;
                            detailName.textContent = character.name;
                            detailCountry.textContent = character.country;
                            
                            characterDetail.classList.add('visible');
                        });
                        
                        characterGrid.appendChild(cell);
                    }
                }
                
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
            }
        });
    </script>
