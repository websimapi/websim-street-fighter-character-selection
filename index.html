<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
        }
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <div class="credit">Image generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter II: The World Warrior - Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with a world map faintly visible, blue/purple gradient with electronic grid lines",
                foreground: "Character portraits arranged in a 3x4 grid, with player cursor indicators"
            },
            characterGrid: {
                rows: 2,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with rounded corners",
                normalState: "Thin white or yellow outline for unselected but highlighted character",
                selectedState: "Thick solid #39FF14 (bright neon green) outline for selected characters",
                animation: "Pulsating effect for the currently highlighted character",
                thickness: "4-6 pixel bold outline for selected characters",
                corners: "Slightly rounded corners on the selection box",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Top row, first position", country: "Japan" },
                { name: "E. Honda", position: "Top row, second position", country: "Japan" },
                { name: "Blanka", position: "Top row, third position", country: "Brazil" },
                { name: "Guile", position: "Top row, fourth position", country: "USA" },
                { name: "Ken", position: "Bottom row, first position", country: "USA" },
                { name: "Chun-Li", position: "Bottom row, second position", country: "China" },
                { name: "Zangief", position: "Bottom row, third position", country: "USSR" },
                { name: "Dhalsim", position: "Bottom row, fourth position", country: "India" }
            ],
            UI: {
                header: "STREET FIGHTER II logo prominently displayed at the top, with 'SELECT YOUR FIGHTER' text below it",
                playerIndicators: "P1 and P2 indicators showing which character each player has selected",
                characterInfo: "Character name and country flag displayed under the highlighted character",
                bottomText: "PRESS BUTTON TO SELECT flashing at the bottom of the screen",
                arcadeElements: "Credit counter in the bottom corner, authentic arcade machine styling"
            },
            visualStyle: {
                characterPortraits: "Close-up headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting and slight 'glow' effect",
                palette: "Vibrant, high-contrast colors typical of early 90s arcade games",
                specialEffects: "Slight CRT scan line effect, pixelated aesthetic authentic to the era"
            },
            specificDetails: {
                selectionRules: "ALL selectable characters have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "The selection indicators should pulse and glow in a way that was impressive for early 90s arcade technology"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a photorealistic image of an arcade Street Fighter II character selection screen based on this detailed specification:
                
${JSON.stringify(characterSelectionTemplate, null, 2)}

Most importantly:
- All selectable characters MUST have a vibrant solid #39FF14 (bright neon green) outline around them
- The image should look like a photograph of an authentic arcade cabinet screen from the early 90s
- Include the iconic STREET FIGHTER II logo at the top
- The character portraits should be arranged in a perfect grid
- Add subtle CRT screen effects like scan lines and slight screen glow
- The green (#39FF14) outlines must be the most eye-catching element in the image`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "4:3", // Classic arcade aspect ratio
                });

                // Display the generated image
                characterSelectScreen.src = result.url;
                characterSelectScreen.onload = () => {
                    loadingIndicator.style.display = 'none';
                };
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
            }
        });
    </script>

</body>
</html>
