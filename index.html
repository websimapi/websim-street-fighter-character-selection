<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: auto;
            background-color: #000;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            display: none;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }

        #character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .character-card {
            position: relative;
            aspect-ratio: 1/1;
            border: 3px solid #39FF14;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: #39FF14;
            padding: 5px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }

        #character-grid-container {
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        #processing-status {
            color: #39FF14;
            text-align: center;
            margin: 10px;
            font-size: 14px;
        }

        .character-country {
            position: absolute;
            top: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 6px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <div id="character-grid-container">
            <div id="processing-status"></div>
            <div id="character-grid"></div>
        </div>
        <div class="credit">Images generated and processed by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const characterGrid = document.getElementById('character-grid');
            const processingStatus = document.getElementById('processing-status');

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

Most importantly:
- NO HEADER TEXT or TITLE anywhere in the image
- ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
- The character portraits should be arranged in a perfect 4x4 grid
- The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
- Include ONLY the character selection grid - no other UI elements, no logos, no text
- Each square should contain a character portrait showing their face/upper body
- Simple dark background behind the character grid
- Only show the 16 characters mentioned in the specification below

${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Display the generated image first
                characterSelectScreen.src = result.url;
                
                // After image loads, analyze it
                characterSelectScreen.onload = async () => {
                    loadingIndicator.querySelector('.loading-text').textContent = 'Analyzing image...';
                    
                    try {
                        // Send the image to the LLM for analysis
                        processingStatus.textContent = "Analyzing the image to identify character grid positions...";
                        
                        // Create a data URL from the image
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = characterSelectScreen.naturalWidth;
                        canvas.height = characterSelectScreen.naturalHeight;
                        ctx.drawImage(characterSelectScreen, 0, 0);
                        const imageDataUrl = canvas.toDataURL('image/jpeg');
                        
                        // Send to LLM for analysis
                        const completion = await websim.chat.completions.create({
                            messages: [
                                {
                                    role: "system",
                                    content: `You are an expert in image analysis and processing.
                                    You'll be given a Street Fighter character selection screen with a 4x4 grid.
                                    Your task is to identify the pixel coordinates for each character portrait in the grid.
                                    You must return JSON with exact coordinates for cropping each character portrait.`
                                },
                                {
                                    role: "user",
                                    content: [
                                        {
                                            type: "text",
                                            text: `Analyze this image of a Street Fighter character selection screen.
                                            It contains a 4x4 grid of character portraits with green outlines.
                                            For each character position (numbered from top-left to bottom-right), provide:
                                            1. The exact pixel coordinates (x, y, width, height) to crop just that character portrait
                                            2. Ensure the coordinates include the green border around each character
                                            
                                            Return a JSON object with this structure:
                                            {
                                              "imageWidth": total image width,
                                              "imageHeight": total image height,
                                              "characters": [
                                                {"row": 1, "col": 1, "x": x1, "y": y1, "width": w1, "height": h1},
                                                ...and so on for all 16 characters in the 4x4 grid
                                              ]
                                            }
                                            
                                            Only respond with this JSON, no additional text.`
                                        },
                                        {
                                            type: "image_url",
                                            image_url: { url: imageDataUrl }
                                        }
                                    ]
                                }
                            ],
                            json: true
                        });
                        
                        // Parse the result
                        const gridAnalysis = JSON.parse(completion.content);
                        
                        // Process each character
                        processingStatus.textContent = "Cropping individual character portraits...";
                        
                        // Clear the loading indicator
                        loadingIndicator.style.display = 'none';
                        
                        // Map character data to grid positions
                        const characterMap = {};
                        characterSelectionTemplate.characters.forEach((char, index) => {
                            const row = Math.floor(index / 4) + 1;
                            const col = (index % 4) + 1;
                            characterMap[`${row},${col}`] = char;
                        });
                        
                        // Process each character position from the analysis
                        gridAnalysis.characters.forEach((pos) => {
                            const charData = characterMap[`${pos.row},${pos.col}`];
                            if (!charData) return;
                            
                            const charCanvas = document.createElement('canvas');
                            const charCtx = charCanvas.getContext('2d');
                            charCanvas.width = pos.width;
                            charCanvas.height = pos.height;
                            
                            // Draw the cropped character to the canvas
                            charCtx.drawImage(
                                characterSelectScreen,
                                pos.x, pos.y, pos.width, pos.height,
                                0, 0, pos.width, pos.height
                            );
                            
                            // Create a character card element
                            const card = document.createElement('div');
                            card.className = 'character-card';
                            
                            // Create the character image element
                            const img = document.createElement('img');
                            img.src = charCanvas.toDataURL('image/jpeg');
                            img.alt = charData.name;
                            
                            // Create the character name label
                            const nameLabel = document.createElement('div');
                            nameLabel.className = 'character-name';
                            nameLabel.textContent = charData.name;
                            
                            // Create the country label
                            const countryLabel = document.createElement('div');
                            countryLabel.className = 'character-country';
                            countryLabel.textContent = charData.country;
                            
                            // Add the elements to the card
                            card.appendChild(img);
                            card.appendChild(nameLabel);
                            card.appendChild(countryLabel);
                            
                            // Add the card to the grid
                            characterGrid.appendChild(card);
                        });
                        
                        processingStatus.textContent = "Character selection roster complete!";
                    } catch (error) {
                        console.error('Error analyzing image:', error);
                        processingStatus.textContent = "Error analyzing the image. Showing original image instead.";
                        // Show original image as fallback
                        characterSelectScreen.style.display = 'block';
                        loadingIndicator.style.display = 'none';
                    }
                };
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
            }
        });
    </script>

</body>
</html>
