<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #interactive-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }
        
        .character-cell {
            position: absolute;
            border: 3px solid transparent;
            box-sizing: border-box;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s ease;
        }
        
        .character-cell:hover {
            border-color: #FF3939; /* Red hover color */
            box-shadow: 0 0 10px #FF3939, inset 0 0 10px #FF3939;
            z-index: 20;
        }
        
        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .character-cell:hover .character-name {
            opacity: 1;
        }
        
        #debug-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none; /* Hide debug canvas by default */
        }
        
        #status {
            position: absolute;
            bottom: 30px;
            left: 10px;
            font-size: 12px;
            color: #39FF14;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <canvas id="debug-canvas"></canvas>
        <div id="interactive-overlay"></div>
        <div id="status"></div>
        <div class="credit">Image generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const statusDisplay = document.getElementById('status');
            const interactiveOverlay = document.getElementById('interactive-overlay');
            const debugCanvas = document.getElementById('debug-canvas');

            // CORS Proxies to try
            const corsProxies = [
                '', // Try direct first
                'https://corsproxy.io/?',
                'https://cors-anywhere.herokuapp.com/',
                'https://api.allorigins.win/raw?url=',
                'https://cors-proxy.htmldriven.com/?url='
            ];

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

Most importantly:
- NO HEADER TEXT or TITLE anywhere in the image
- ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
- The character portraits should be arranged in a perfect 4x4 grid
- The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
- Include ONLY the character selection grid - no other UI elements, no logos, no text
- Each square should contain a character portrait showing their face/upper body
- Simple dark background behind the character grid
- Only show the 16 characters mentioned in the specification below

${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Display the generated image and set up CORS fetch with fallbacks
                await fetchImageWithFallback(result.url, corsProxies);
                
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
                
                // Fallback to using the attached image
                try {
                    await fetchImageWithFallback('/a/75431cc0-b839-4c74-8a31-af889058d1d7', corsProxies);
                } catch (fallbackError) {
                    console.error('Failed to load fallback image:', fallbackError);
                }
            }

            // Function to fetch image using multiple CORS proxies as fallbacks
            async function fetchImageWithFallback(url, proxies, proxyIndex = 0) {
                if (proxyIndex >= proxies.length) {
                    throw new Error('All CORS proxies failed');
                }

                try {
                    updateStatus(`Trying proxy ${proxyIndex + 1}/${proxies.length}...`);
                    const proxyUrl = proxies[proxyIndex] + url;
                    
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                    
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    characterSelectScreen.src = imageUrl;
                    characterSelectScreen.onload = () => {
                        loadingIndicator.style.display = 'none';
                        processImage(characterSelectScreen);
                    };
                    
                    updateStatus(`Image loaded successfully!`);
                } catch (error) {
                    console.warn(`Proxy ${proxyIndex + 1} failed:`, error);
                    // Try next proxy
                    return fetchImageWithFallback(url, proxies, proxyIndex + 1);
                }
            }

            // Process the image to detect character grid
            function processImage(imageElement) {
                updateStatus('Processing image to detect character grid...');
                
                // Create off-screen canvas for analysis
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set canvas to image dimensions
                canvas.width = imageElement.naturalWidth;
                canvas.height = imageElement.naturalHeight;
                
                // Draw image to canvas
                ctx.drawImage(imageElement, 0, 0);
                
                // Get image data for analysis
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Target color: #39FF14 (bright neon green) with some tolerance
                const targetR = 57, targetG = 255, targetB = 20;
                const tolerance = 50; // Adjust tolerance as needed
                
                // Find green pixels (representing outlines of the character squares)
                const greenPixels = [];
                const sampleRate = 2; // Sample every 2 pixels for performance
                
                updateStatus('Scanning for green outline pixels...');
                
                // Scan for green pixels
                for (let y = 0; y < canvas.height; y += sampleRate) {
                    for (let x = 0; x < canvas.width; x += sampleRate) {
                        const i = (y * canvas.width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Check if pixel is close to target green
                        if (Math.abs(r - targetR) <= tolerance && 
                            Math.abs(g - targetG) <= tolerance && 
                            Math.abs(b - targetB) <= tolerance) {
                            greenPixels.push({x, y});
                        }
                    }
                }
                
                updateStatus(`Found ${greenPixels.length} green pixels, detecting character cells...`);
                
                // Set up debug canvas
                debugCanvas.width = imageElement.width;
                debugCanvas.height = imageElement.height;
                const debugCtx = debugCanvas.getContext('2d');
                
                // Draw original image with reduced opacity
                debugCtx.globalAlpha = 0.5;
                debugCtx.drawImage(imageElement, 0, 0, debugCanvas.width, debugCanvas.height);
                debugCtx.globalAlpha = 1.0;
                
                // Improved cell detection using clustering approach
                const characterCells = improvedCellDetection(greenPixels, canvas.width, canvas.height, data);
                
                // Draw detected cells on debug canvas
                debugCtx.strokeStyle = 'red';
                debugCtx.lineWidth = 2;
                characterCells.forEach(cell => {
                    debugCtx.strokeRect(cell.x, cell.y, cell.width, cell.height);
                    
                    // Add cell center marker
                    debugCtx.fillStyle = 'blue';
                    debugCtx.beginPath();
                    debugCtx.arc(cell.x + cell.width/2, cell.y + cell.height/2, 5, 0, Math.PI * 2);
                    debugCtx.fill();
                });
                
                // Show debug canvas for development
                debugCanvas.style.display = 'block';
                
                // Create interactive overlay for each detected cell
                createInteractiveOverlay(characterCells);
                
                updateStatus(`Character grid detected: found ${characterCells.length} character cells!`);
            }
            
            // Improved cell detection using clustering and heuristics
            function improvedCellDetection(greenPixels, width, height, imageData) {
                // First, find potential grid cells using horizontal and vertical density
                updateStatus('Analyzing pixel density to identify character cells...');
                
                // Create horizontal and vertical density histograms
                const xHistogram = new Array(width).fill(0);
                const yHistogram = new Array(height).fill(0);
                
                greenPixels.forEach(pixel => {
                    xHistogram[pixel.x]++;
                    yHistogram[pixel.y]++;
                });
                
                // Find peaks in histograms - these indicate probable grid lines
                const xPeaks = findPeaks(xHistogram, width * 0.01);
                const yPeaks = findPeaks(yHistogram, height * 0.01);
                
                updateStatus(`Found ${xPeaks.length} vertical lines and ${yPeaks.length} horizontal lines`);
                
                // If we have a reasonable number of peaks, assume they form a grid
                const cells = [];
                const expectedRows = 4;
                const expectedCols = 4;
                
                // Group peaks into rows and columns
                const xGridLines = groupPeaks(xPeaks, width * 0.03);
                const yGridLines = groupPeaks(yPeaks, height * 0.03);
                
                // Sort grid lines
                xGridLines.sort((a, b) => a - b);
                yGridLines.sort((a, b) => a - b);
                
                // Create cells from grid intersections
                if (xGridLines.length >= expectedCols+1 && yGridLines.length >= expectedRows+1) {
                    // We found a grid structure, create cells
                    for (let i = 0; i < yGridLines.length-1; i++) {
                        for (let j = 0; j < xGridLines.length-1; j++) {
                            const x = xGridLines[j];
                            const y = yGridLines[i];
                            const width = xGridLines[j+1] - x;
                            const height = yGridLines[i+1] - y;
                            
                            // Only keep cells with reasonable size
                            if (width > 30 && height > 30) {
                                cells.push({
                                    x, y, width, height,
                                    character: getCharacterForPosition(i, j)
                                });
                            }
                        }
                    }
                }
                
                // If grid detection didn't work, fall back to rectangular region detection
                if (cells.length < 8) {
                    updateStatus('Grid detection insufficient, trying region detection...');
                    return detectRectangularRegions(greenPixels, width, height, imageData);
                }
                
                return cells;
            }
            
            // Detect rectangular regions formed by green pixels
            function detectRectangularRegions(greenPixels, width, height, imageData) {
                // Create a 2D map of green pixel locations for faster lookup
                const greenMap = {};
                greenPixels.forEach(pixel => {
                    if (!greenMap[pixel.y]) greenMap[pixel.y] = {};
                    greenMap[pixel.y][pixel.x] = true;
                });
                
                // Find connected components (rectangles)
                const visited = {};
                const rectangles = [];
                const minRectSize = 30;  // Minimum rect size to consider
                
                // Check each green pixel as a potential corner
                greenPixels.forEach(pixel => {
                    if (visited[`${pixel.y},${pixel.x}`]) return;
                    
                    // Try to grow a rectangle from this pixel
                    const rect = growRectangle(pixel.x, pixel.y, greenMap, visited, width, height);
                    if (rect && rect.width > minRectSize && rect.height > minRectSize) {
                        // Check if the rectangle has non-green content
                        if (hasNonGreenContent(rect, greenMap, width, height, imageData)) {
                            rectangles.push(rect);
                        }
                    }
                });
                
                // Map rectangles to characters
                return mapRectanglesToCharacters(rectangles);
            }
            
            // Grow a rectangle from a starting corner
            function growRectangle(startX, startY, greenMap, visited, width, height) {
                // Mark starting pixel as visited
                visited[`${startY},${startX}`] = true;
                
                // Find maximum rectangle width (rightward)
                let maxWidth = 1;
                for (let x = startX + 1; x < width; x++) {
                    if (greenMap[startY] && greenMap[startY][x]) {
                        maxWidth = x - startX + 1;
                        visited[`${startY},${x}`] = true;
                    } else {
                        break;
                    }
                }
                
                if (maxWidth < 20) return null; // Too narrow
                
                // Find maximum rectangle height (downward)
                let maxHeight = 1;
                let isValidRect = false;
                
                for (let y = startY + 1; y < height; y++) {
                    // Check if the left edge is green
                    if (!(greenMap[y] && greenMap[y][startX])) break;
                    
                    // Check if the right edge is green
                    if (!(greenMap[y] && greenMap[y][startX + maxWidth - 1])) break;
                    
                    // Check bottom edge when we've gone far enough
                    if (y - startY >= maxWidth * 0.5) { // Rectangular aspect ratio check
                        let hasBottomEdge = true;
                        for (let x = startX; x < startX + maxWidth; x++) {
                            if (!(greenMap[y] && greenMap[y][x])) {
                                hasBottomEdge = false;
                                break;
                            }
                        }
                        
                        if (hasBottomEdge) {
                            maxHeight = y - startY + 1;
                            isValidRect = true;
                            
                            // Mark all edge pixels as visited
                            for (let x = startX; x < startX + maxWidth; x++) {
                                visited[`${y},${x}`] = true;
                            }
                            for (let tempY = startY; tempY <= y; tempY++) {
                                visited[`${tempY},${startX}`] = true;
                                visited[`${tempY},${startX + maxWidth - 1}`] = true;
                            }
                            
                            break;
                        }
                    }
                    
                    // Mark edge pixels as visited
                    visited[`${y},${startX}`] = true;
                    visited[`${y},${startX + maxWidth - 1}`] = true;
                }
                
                if (!isValidRect || maxHeight < 20) return null; // Not a complete rectangle or too short
                
                return {
                    x: startX,
                    y: startY,
                    width: maxWidth,
                    height: maxHeight
                };
            }
            
            // Check if a rectangle has non-green content inside
            function hasNonGreenContent(rect, greenMap, width, height, imageData) {
                const padding = 5; // Avoid checking the border pixels
                let nonGreenCount = 0;
                const minNonGreenPixels = 25 * 25; // Minimum non-green pixels to consider valid content
                
                // Sample the interior of the rectangle
                for (let y = rect.y + padding; y < rect.y + rect.height - padding; y += 2) {
                    if (y >= height) continue;
                    
                    for (let x = rect.x + padding; x < rect.x + rect.width - padding; x += 2) {
                        if (x >= width) continue;
                        
                        // If the pixel is not marked as green, count it
                        if (!(greenMap[y] && greenMap[y][x])) {
                            nonGreenCount++;
                            if (nonGreenCount >= minNonGreenPixels / 4) { // Divide by 4 because we're sampling every 2 pixels
                                return true;
                            }
                        }
                    }
                }
                
                return false;
            }
            
            // Map rectangles to characters based on position
            function mapRectanglesToCharacters(rectangles) {
                if (rectangles.length === 0) return [];
                
                // Expected grid dimensions
                const expectedRows = 4;
                const expectedCols = 4;
                
                // Sort rectangles by position
                const sorted = [...rectangles].sort((a, b) => {
                    // First sort by y-coordinate (top to bottom)
                    const yDiff = a.y - b.y;
                    if (Math.abs(yDiff) > 20) return yDiff;
                    
                    // If in the same row, sort by x-coordinate (left to right)
                    return a.x - b.x;
                });
                
                // Group into rows based on y-position
                const rows = [];
                let currentRow = [sorted[0]];
                
                for (let i = 1; i < sorted.length; i++) {
                    const prevRect = sorted[i-1];
                    const currRect = sorted[i];
                    
                    // If y-position is similar, add to current row
                    if (Math.abs(currRect.y - prevRect.y) <= 20) {
                        currentRow.push(currRect);
                    } else {
                        // Start a new row
                        rows.push(currentRow);
                        currentRow = [currRect];
                    }
                }
                
                // Add the last row
                if (currentRow.length > 0) {
                    rows.push(currentRow);
                }
                
                // Sort each row by x-position
                rows.forEach(row => {
                    row.sort((a, b) => a.x - b.x);
                });
                
                // Map to characters
                const characters = characterSelectionTemplate.characters;
                const result = [];
                
                for (let r = 0; r < Math.min(rows.length, expectedRows); r++) {
                    const row = rows[r];
                    for (let c = 0; c < Math.min(row.length, expectedCols); c++) {
                        const charIndex = r * expectedCols + c;
                        if (charIndex < characters.length) {
                            result.push({
                                ...row[c],
                                character: characters[charIndex]
                            });
                        }
                    }
                }
                
                return result;
            }
            
            // Find peaks in a histogram
            function findPeaks(histogram, threshold) {
                const peaks = [];
                const smoothed = smoothHistogram(histogram, 5);
                
                for (let i = 2; i < smoothed.length - 2; i++) {
                    if (smoothed[i] > threshold && 
                        smoothed[i] > smoothed[i-1] && 
                        smoothed[i] > smoothed[i-2] && 
                        smoothed[i] > smoothed[i+1] && 
                        smoothed[i] > smoothed[i+2]) {
                        peaks.push(i);
                    }
                }
                
                return peaks;
            }
            
            // Smooth a histogram using moving average
            function smoothHistogram(histogram, windowSize) {
                const result = new Array(histogram.length).fill(0);
                
                for (let i = 0; i < histogram.length; i++) {
                    let sum = 0;
                    let count = 0;
                    
                    for (let j = Math.max(0, i - windowSize); j <= Math.min(histogram.length - 1, i + windowSize); j++) {
                        sum += histogram[j];
                        count++;
                    }
                    
                    result[i] = sum / count;
                }
                
                return result;
            }
            
            // Group nearby peaks into single representative values
            function groupPeaks(peaks, distance) {
                if (peaks.length === 0) return [];
                
                const groups = [];
                let currentGroup = [peaks[0]];
                
                for (let i = 1; i < peaks.length; i++) {
                    if (peaks[i] - peaks[i-1] <= distance) {
                        // Add to current group
                        currentGroup.push(peaks[i]);
                    } else {
                        // Create a new group
                        groups.push(currentGroup);
                        currentGroup = [peaks[i]];
                    }
                }
                
                // Add the last group
                if (currentGroup.length > 0) {
                    groups.push(currentGroup);
                }
                
                // Calculate the average value for each group
                return groups.map(group => {
                    return Math.floor(group.reduce((sum, val) => sum + val, 0) / group.length);
                });
            }
            
            // Get character data for a given position
            function getCharacterForPosition(row, col) {
                const index = row * 4 + col;
                if (index < characterSelectionTemplate.characters.length) {
                    return characterSelectionTemplate.characters[index];
                }
                return null;
            }
            
            // Create interactive overlay with hover effects
            function createInteractiveOverlay(cells) {
                interactiveOverlay.innerHTML = '';
                
                cells.forEach((cell, index) => {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'character-cell';
                    cellElement.style.left = `${cell.x}px`;
                    cellElement.style.top = `${cell.y}px`;
                    cellElement.style.width = `${cell.width}px`;
                    cellElement.style.height = `${cell.height}px`;
                    
                    // Add character information as data attributes
                    if (cell.character) {
                        cellElement.dataset.name = cell.character.name;
                        cellElement.dataset.country = cell.character.country;
                        
                        // Add name label
                        const nameElement = document.createElement('div');
                        nameElement.className = 'character-name';
                        nameElement.textContent = `${cell.character.name} (${cell.character.country})`;
                        cellElement.appendChild(nameElement);
                    }
                    
                    // Add click event
                    cellElement.addEventListener('click', () => {
                        if (cell.character) {
                            updateStatus(`Selected: ${cell.character.name} from ${cell.character.country}`);
                            
                            // Flash effect on selection
                            cellElement.style.boxShadow = '0 0 15px #FFFFFF, inset 0 0 15px #FFFFFF';
                            setTimeout(() => {
                                cellElement.style.boxShadow = '';
                            }, 300);
                        }
                    });
                    
                    interactiveOverlay.appendChild(cellElement);
                });
            }
            
            // Helper function to update status display
            function updateStatus(message) {
                statusDisplay.textContent = message;
                console.log(message);
            }
