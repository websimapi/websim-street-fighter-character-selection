<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
            background-color: #000;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            display: none;
        }
        
        #character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .character-cell {
            position: relative;
            border: 3px solid #39FF14;
            border-radius: 4px;
            background-color: #111;
            overflow: hidden;
        }
        
        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .character-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: #39FF14;
            padding: 3px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #character-canvas {
            display: none;
        }
        
        /* Add error message styling */
        .error-message {
            color: red;
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid red;
            border-radius: 5px;
            margin: 20px;
        }
        
        /* Add retry button styling */
        .retry-button {
            padding: 10px 20px;
            background-color: #39FF14;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .retry-button:hover {
            background-color: #2ce00f;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <div id="character-grid"></div>
        <canvas id="character-canvas"></canvas>
        <div class="credit">Images generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const characterGrid = document.getElementById('character-grid');
            const canvas = document.getElementById('character-canvas');
            const ctx = canvas.getContext('2d');

            // Array of CORS proxies to try
            const corsProxies = [
                '', // Direct access first (no proxy)
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://thingproxy.freeboard.io/fetch/',
                'https://yacdn.org/proxy/',
                'https://cors-anywhere.herokuapp.com/'
            ];
            
            // Function to show error with retry button
            function showError(message, retryFunction) {
                loadingIndicator.innerHTML = `
                    <div class="error-message">${message}</div>
                    ${retryFunction ? '<button class="retry-button">Retry</button>' : ''}
                `;
                
                if (retryFunction) {
                    const retryButton = loadingIndicator.querySelector('.retry-button');
                    retryButton.addEventListener('click', () => {
                        loadingIndicator.innerHTML = `
                            <div class="loading-spinner"></div>
                            <div class="loading-text">Retrying...</div>
                        `;
                        setTimeout(retryFunction, 500);
                    });
                }
            }

            // Main function to generate image and process characters
            async function generateAndProcessImage() {
                try {
                    // Generate the detailed image prompt
                    const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

                    Most importantly:
                    - NO HEADER TEXT or TITLE anywhere in the image
                    - ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
                    - The character portraits should be arranged in a perfect 4x4 grid
                    - The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
                    - Include ONLY the character selection grid - no other UI elements, no logos, no text
                    - Each square should contain a character portrait showing their face/upper body
                    - Simple dark background behind the character grid
                    - Only show the 16 characters mentioned in the specification below

                    ${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                    loadingIndicator.querySelector('.loading-text').textContent = "Generating character selection screen...";
                    
                    // Use LLM to generate the image
                    const result = await websim.imageGen({
                        prompt: imagePrompt,
                        aspect_ratio: "1:1", // Square aspect ratio for the grid
                    });

                    // Store the image URL
                    const imageUrl = result.url;
                    
                    // Since we've generated the image, now try the alternative approach
                    // by asking the LLM to generate coordinates directly
                    try {
                        await processCharactersDirectly(imageUrl);
                    } catch (error) {
                        console.error("Direct processing failed:", error);
                        // Fallback to proxy method
                        await processWithProxies(imageUrl);
                    }
                } catch (error) {
                    console.error('Error generating image:', error);
                    showError(`Error generating image: ${error.message}`, generateAndProcessImage);
                }
            }

            // Process characters without needing canvas export
            async function processCharactersDirectly(imageUrl) {
                loadingIndicator.querySelector('.loading-text').textContent = "Analyzing character positions...";
                
                // Display the generated image
                characterSelectScreen.src = imageUrl;
                
                // Ask LLM to analyze the image and determine grid coordinates directly
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "user",
                            content: [
                                {
                                    type: "text",
                                    text: `Analyze this Street Fighter character selection screen. It shows a 4x4 grid of characters.
                                    
                                    I need you to:
                                    1. Visually estimate the grid layout and where each character would be positioned
                                    2. Create a uniform grid by dividing the image into 4 rows and 4 columns
                                    3. Provide rough percentage-based coordinates for each character
                                    
                                    The characters are:
                                    Row 1: Ryu, Ken, Chun-Li, Guile
                                    Row 2: E. Honda, Blanka, Zangief, Dhalsim
                                    Row 3: Balrog, Vega, Sagat, M. Bison
                                    Row 4: Akuma, Cammy, Fei Long, T. Hawk
                                    
                                    Return a JSON array with percentage-based coordinates like this:
                                    [
                                      {"name": "Ryu", "row": 0, "col": 0, "percentX": 0, "percentY": 0, "percentWidth": 25, "percentHeight": 25},
                                      {"name": "Ken", "row": 0, "col": 1, "percentX": 25, "percentY": 0, "percentWidth": 25, "percentHeight": 25},
                                      ...and so on for all 16 characters
                                    ]
                                    
                                    Ensure each character has a unique position in the grid.`,
                                },
                                {
                                    type: "image_url",
                                    image_url: { url: imageUrl },
                                },
                            ],
                        },
                    ],
                    json: true,
                });

                const characterPositions = JSON.parse(completion.content);
                await createCharacterGrid(characterPositions, imageUrl);
            }
            
            // Try to process with different proxies
            async function processWithProxies(originalImageUrl) {
                loadingIndicator.querySelector('.loading-text').textContent = "Trying alternative methods...";
                
                // Display the original image first
                characterSelectScreen.src = originalImageUrl;
                
                // Try to get the grid directly from LLM without canvas
                const defaultGrid = [];
                const rows = 4;
                const cols = 4;
                
                // Create a uniform grid based on percentage
                const characters = [
                    "Ryu", "Ken", "Chun-Li", "Guile",
                    "E. Honda", "Blanka", "Zangief", "Dhalsim",
                    "Balrog", "Vega", "Sagat", "M. Bison",
                    "Akuma", "Cammy", "Fei Long", "T. Hawk"
                ];
                
                let index = 0;
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        defaultGrid.push({
                            name: characters[index],
                            row: row,
                            col: col,
                            percentX: col * (100 / cols),
                            percentY: row * (100 / rows),
                            percentWidth: 100 / cols,
                            percentHeight: 100 / rows
                        });
                        index++;
                    }
                }
                
                // Now use the default grid with the original image
                await createCharacterGrid(defaultGrid, originalImageUrl);
            }
            
            // Function to create the character grid with the positions
            async function createCharacterGrid(characterPositions, imageUrl) {
                loadingIndicator.querySelector('.loading-text').textContent = "Creating character grid...";
                
                // Clear any existing characters
                characterGrid.innerHTML = '';
                
                // Create characters in the grid
                for (const character of characterPositions) {
                    // Create a character cell div
                    const cell = document.createElement('div');
                    cell.className = 'character-cell';
                    
                    // Create the character image with background positioning
                    const characterDiv = document.createElement('div');
                    characterDiv.className = 'character-image';
                    characterDiv.style.backgroundImage = `url(${imageUrl})`;
                    characterDiv.style.backgroundPosition = `${-character.percentX}% ${-character.percentY}%`;
                    characterDiv.style.backgroundSize = `${100 / (character.percentWidth / 100)}% ${100 / (character.percentHeight / 100)}%`;
                    
                    // Add name label
                    const nameLabel = document.createElement('div');
                    nameLabel.className = 'character-name';
                    nameLabel.textContent = character.name;
                    
                    // Add to cell and grid
                    cell.appendChild(characterDiv);
                    cell.appendChild(nameLabel);
                    characterGrid.appendChild(cell);
                }
                
                // Add click events to characters
                document.querySelectorAll('.character-cell').forEach(cell => {
                    cell.addEventListener('click', () => {
                        // Could add selection highlight logic here
                        const name = cell.querySelector('.character-name').textContent;
                        console.log(`Selected: ${name}`);
                    });
                });
                
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
                characterGrid.style.display = 'grid';
            }

            // Start the process
            generateAndProcessImage();
        });
    </script>

</body>
</html>
