<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Character Selection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #app {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
        }
        
        #character-select-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
        }
        
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-size: 24px;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #39FF14;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #333;
            border-top: 8px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .credit {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #interactive-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }
        
        .character-cell {
            position: absolute;
            border: 3px solid transparent;
            box-sizing: border-box;
            cursor: pointer;
            pointer-events: auto;
            transition: border-color 0.2s ease;
        }
        
        .character-cell:hover {
            border-color: #FF3939; /* Red hover color */
        }
        
        #debug-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none; /* Hide debug canvas by default */
        }
        
        #status {
            position: absolute;
            bottom: 30px;
            left: 10px;
            font-size: 12px;
            color: #39FF14;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Generating Character Selection Screen</div>
        </div>
        <img id="character-select-screen" alt="Street Fighter Character Selection Screen">
        <canvas id="debug-canvas"></canvas>
        <div id="interactive-overlay"></div>
        <div id="status"></div>
        <div class="credit">Image generated by AI</div>
    </div>

    <script type="module">
        // Detailed template for Street Fighter character selection screen
        const characterSelectionTemplate = {
            title: "Street Fighter Character Selection Screen",
            layout: {
                background: "Dark arcade-style background with electronic grid lines",
                foreground: "Character portraits arranged in a 4x4 grid"
            },
            characterGrid: {
                rows: 4,
                columns: 4,
                spacing: "Equal spacing between character portraits with clear boundaries"
            },
            selectionIndicator: {
                type: "Square outline with slightly rounded corners",
                appearance: "ALL character squares have a solid #39FF14 (bright neon green) outline",
                thickness: "6 pixel bold outline for all characters",
                additionalEffects: "Inner glow effect emanating from the outline"
            },
            characters: [
                { name: "Ryu", position: "Row 1, column 1", country: "Japan" },
                { name: "Ken", position: "Row 1, column 2", country: "USA" },
                { name: "Chun-Li", position: "Row 1, column 3", country: "China" },
                { name: "Guile", position: "Row 1, column 4", country: "USA" },
                { name: "E. Honda", position: "Row 2, column 1", country: "Japan" },
                { name: "Blanka", position: "Row 2, column 2", country: "Brazil" },
                { name: "Zangief", position: "Row 2, column 3", country: "USSR" },
                { name: "Dhalsim", position: "Row 2, column 4", country: "India" },
                { name: "Balrog", position: "Row 3, column 1", country: "USA" },
                { name: "Vega", position: "Row 3, column 2", country: "Spain" },
                { name: "Sagat", position: "Row 3, column 3", country: "Thailand" },
                { name: "M. Bison", position: "Row 3, column 4", country: "Unknown" },
                { name: "Akuma", position: "Row 4, column 1", country: "Japan" },
                { name: "Cammy", position: "Row 4, column 2", country: "UK" },
                { name: "Fei Long", position: "Row 4, column 3", country: "Hong Kong" },
                { name: "T. Hawk", position: "Row 4, column 4", country: "Mexico" }
            ],
            visualStyle: {
                characterPortraits: "Headshots/upper body shots of each fighter in their iconic pose",
                lighting: "Characters appear with dynamic lighting",
                palette: "Vibrant, high-contrast colors"
            },
            specificDetails: {
                selectionRules: "ALL 16 character squares MUST have a solid #39FF14 (bright neon green) outline around them",
                styleNote: "FOCUS ONLY ON THE CHARACTER GRID WITH GREEN OUTLINES - NO OTHER UI ELEMENTS"
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const characterSelectScreen = document.getElementById('character-select-screen');
            const loadingIndicator = document.getElementById('loading');
            const statusDisplay = document.getElementById('status');
            const interactiveOverlay = document.getElementById('interactive-overlay');
            const debugCanvas = document.getElementById('debug-canvas');

            // CORS Proxies to try
            const corsProxies = [
                '', // Try direct first
                'https://corsproxy.io/?',
                'https://cors-anywhere.herokuapp.com/',
                'https://api.allorigins.win/raw?url=',
                'https://cors-proxy.htmldriven.com/?url='
            ];

            try {
                // Generate the detailed image prompt
                const imagePrompt = `Create a clean, focused image of a Street Fighter character selection screen with exactly 16 characters in a 4x4 grid. 

Most importantly:
- NO HEADER TEXT or TITLE anywhere in the image
- ALL 16 character squares MUST have a prominent solid #39FF14 (bright neon green) outline around them
- The character portraits should be arranged in a perfect 4x4 grid
- The green (#39FF14) outlines should be thick (6 pixels) and be the most eye-catching element
- Include ONLY the character selection grid - no other UI elements, no logos, no text
- Each square should contain a character portrait showing their face/upper body
- Simple dark background behind the character grid
- Only show the 16 characters mentioned in the specification below

${JSON.stringify(characterSelectionTemplate.characters, null, 2)}`;

                // Use LLM to generate the image
                const result = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "1:1", // Square aspect ratio for the grid
                });

                // Display the generated image and set up CORS fetch with fallbacks
                await fetchImageWithFallback(result.url, corsProxies);
                
            } catch (error) {
                console.error('Error generating image:', error);
                loadingIndicator.innerHTML = `<div>Error generating image. Please refresh the page.</div>`;
                
                // Fallback to using the attached image
                try {
                    await fetchImageWithFallback('/a/75431cc0-b839-4c74-8a31-af889058d1d7', corsProxies);
                } catch (fallbackError) {
                    console.error('Failed to load fallback image:', fallbackError);
                }
            }

            // Function to fetch image using multiple CORS proxies as fallbacks
            async function fetchImageWithFallback(url, proxies, proxyIndex = 0) {
                if (proxyIndex >= proxies.length) {
                    throw new Error('All CORS proxies failed');
                }

                try {
                    updateStatus(`Trying proxy ${proxyIndex + 1}/${proxies.length}...`);
                    const proxyUrl = proxies[proxyIndex] + url;
                    
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                    
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    characterSelectScreen.src = imageUrl;
                    characterSelectScreen.onload = () => {
                        loadingIndicator.style.display = 'none';
                        processImage(characterSelectScreen);
                    };
                    
                    updateStatus(`Image loaded successfully!`);
                } catch (error) {
                    console.warn(`Proxy ${proxyIndex + 1} failed:`, error);
                    // Try next proxy
                    return fetchImageWithFallback(url, proxies, proxyIndex + 1);
                }
            }

            // Process the image to detect character grid
            function processImage(imageElement) {
                updateStatus('Processing image to detect character grid...');
                
                // Create off-screen canvas for analysis
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set canvas to image dimensions
                canvas.width = imageElement.naturalWidth;
                canvas.height = imageElement.naturalHeight;
                
                // Draw image to canvas
                ctx.drawImage(imageElement, 0, 0);
                
                // Get image data for analysis
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Target color: #39FF14 (bright neon green) with some tolerance
                const targetR = 57, targetG = 255, targetB = 20;
                const tolerance = 50; // Adjust tolerance as needed
                
                // Find green pixels (representing outlines of the character squares)
                const greenPixelMap = new Map(); // Use map for faster lookups
                const sampleRate = 2; // Sample every 2 pixels for performance
                
                updateStatus('Scanning for green outline pixels...');
                
                // Create a 2D array to represent the image grid
                const width = canvas.width;
                const height = canvas.height;
                const pixelGrid = Array(height).fill().map(() => Array(width).fill(false));
                
                // Scan for green pixels
                for (let y = 0; y < height; y += sampleRate) {
                    for (let x = 0; x < width; x += sampleRate) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Check if pixel is close to target green
                        if (Math.abs(r - targetR) <= tolerance && 
                            Math.abs(g - targetG) <= tolerance && 
                            Math.abs(b - targetB) <= tolerance) {
                            pixelGrid[y][x] = true;
                            greenPixelMap.set(`${x},${y}`, true);
                        }
                    }
                }
                
                updateStatus(`Found ${greenPixelMap.size} green pixels, detecting character cells...`);
                
                // Set up debug canvas
                debugCanvas.width = imageElement.width;
                debugCanvas.height = imageElement.height;
                const debugCtx = debugCanvas.getContext('2d');
                
                // Draw original image with reduced opacity
                debugCtx.globalAlpha = 0.5;
                debugCtx.drawImage(imageElement, 0, 0, debugCanvas.width, debugCanvas.height);
                debugCtx.globalAlpha = 1.0;
                
                // Find potential character regions
                const characterCells = findCharacterCells(pixelGrid, imageData.data, width, height, targetR, targetG, targetB, tolerance);
                
                // Draw detected cells on debug canvas
                debugCtx.strokeStyle = 'red';
                debugCtx.lineWidth = 2;
                characterCells.forEach(cell => {
                    debugCtx.strokeRect(cell.x, cell.y, cell.width, cell.height);
                });
                
                // Show debug canvas for development
                debugCanvas.style.display = 'block';
                
                // Create interactive overlay for each detected cell
                createInteractiveOverlay(characterCells);
                
                updateStatus(`Character grid detected: found ${characterCells.length} character cells!`);
            }
            
            // Function to find character cells based on green outlines
            function findCharacterCells(pixelGrid, imageData, width, height, targetR, targetG, targetB, tolerance) {
                const cells = [];
                const visited = new Set();
                const minCellSize = 30; // Minimum size to consider as a valid character cell
                const minContentSize = 25; // Minimum size of non-green content inside a cell
                
                // Helper function to check if the pixel is green
                function isGreen(x, y) {
                    if (x < 0 || x >= width || y < 0 || y >= height) return false;
                    const i = (y * width + x) * 4;
                    const r = imageData[i];
                    const g = imageData[i + 1];
                    const b = imageData[i + 2];
                    return Math.abs(r - targetR) <= tolerance && 
                           Math.abs(g - targetG) <= tolerance && 
                           Math.abs(b - targetB) <= tolerance;
                }
                
                // Find horizontal lines of green pixels
                for (let y = 0; y < height; y += 2) {
                    let startX = -1;
                    for (let x = 0; x < width; x += 1) {
                        if (isGreen(x, y)) {
                            if (startX === -1) startX = x;
                        } else if (startX !== -1) {
                            // We found a horizontal green line from startX to x-1
                            const lineLength = x - startX;
                            if (lineLength > minCellSize) {
                                // Check for vertical lines that could form a rectangle
                                let foundRect = findRectangle(startX, y, lineLength);
                                if (foundRect) {
                                    cells.push(foundRect);
                                }
                            }
                            startX = -1;
                        }
                    }
                }
                
                // Helper function to find a rectangle starting from a horizontal line
                function findRectangle(startX, startY, lineLength) {
                    // Look for vertical green lines descending from both ends of the horizontal line
                    let leftFound = false;
                    let rightFound = false;
                    let maxHeight = 0;
                    
                    // Check how far down we can go following the left edge
                    for (let y = startY + 1; y < startY + height/2; y++) { 
                        if (isGreen(startX, y)) {
                            maxHeight = y - startY;
                        } else {
                            break;
                        }
                    }
                    
                    if (maxHeight < minCellSize) return null;
                    
                    // Check how far down we can go following the right edge
                    const endX = startX + lineLength - 1;
                    let rightHeight = 0;
                    for (let y = startY + 1; y < startY + maxHeight; y++) {
                        if (isGreen(endX, y)) {
                            rightHeight = y - startY;
                        } else {
                            break;
                        }
                    }
                    
                    if (rightHeight < minCellSize) return null;
                    
                    // Use the smaller of the two heights
                    const rectHeight = Math.min(maxHeight, rightHeight);
                    
                    // Check bottom horizontal line
                    let bottomY = startY + rectHeight;
                    let bottomLine = true;
                    for (let x = startX; x <= endX; x++) {
                        if (!isGreen(x, bottomY)) {
                            bottomLine = false;
                            break;
                        }
                    }
                    
                    if (!bottomLine) return null;
                    
                    // We found a rectangle! Check if it has content inside
                    const cellId = `${startX},${startY},${lineLength},${rectHeight}`;
                    if (visited.has(cellId)) return null;
                    visited.add(cellId);
                    
                    // Check for non-green content inside the rectangle
                    let nonGreenCount = 0;
                    const innerPadding = 5; // Padding to avoid counting the outline
                    for (let y = startY + innerPadding; y < startY + rectHeight - innerPadding; y += 2) {
                        for (let x = startX + innerPadding; x < startX + lineLength - innerPadding; x += 2) {
                            if (!isGreen(x, y)) {
                                nonGreenCount++;
                            }
                            if (nonGreenCount >= minContentSize * minContentSize / 4) {
                                // Enough non-green content found
                                return {
                                    x: startX,
                                    y: startY,
                                    width: lineLength,
                                    height: rectHeight,
                                    contentRatio: nonGreenCount / ((lineLength - 2 * innerPadding) * (rectHeight - 2 * innerPadding) / 4)
                                };
                            }
                        }
                    }
                    
                    return null; // Not enough content inside
                }
                
                // If we didn't find enough cells, try column-by-column scanning
                if (cells.length < 8) {
                    // Similar logic but scanning vertical lines first, omitted for brevity
                }
                
                // Map detected cells to character data
                return mapCellsToCharacters(cells);
            }
            
            // Map detected cells to character data
            function mapCellsToCharacters(cells) {
                if (cells.length === 0) return [];
                
                // Sort cells by position (top to bottom, left to right)
                cells.sort((a, b) => {
                    // Group cells into rows based on Y position
                    const rowThreshold = 20; // Cells within this Y distance are considered in the same row
                    const rowDiff = Math.abs(a.y - b.y);
                    if (rowDiff <= rowThreshold) {
                        return a.x - b.x; // Same row, sort by X
                    }
                    return a.y - b.y; // Different rows, sort by Y
                });
                
                // Assign character data to cells
                const maxCols = 5; // Maximum expected columns based on image
                const characters = characterSelectionTemplate.characters;
                const mappedCells = cells.slice(0, characters.length).map((cell, index) => {
                    const row = Math.floor(index / maxCols);
                    const col = index % maxCols;
                    const charIndex = Math.min(index, characters.length - 1);
                    return {
                        ...cell,
                        row,
                        col,
                        character: characters[charIndex]
                    };
                });
                
                return mappedCells;
            }
            
            // Create interactive overlay with hover effects
            function createInteractiveOverlay(cells) {
                interactiveOverlay.innerHTML = '';
                
                cells.forEach((cell, index) => {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'character-cell';
                    cellElement.style.left = `${cell.x}px`;
                    cellElement.style.top = `${cell.y}px`;
                    cellElement.style.width = `${cell.width}px`;
                    cellElement.style.height = `${cell.height}px`;
                    
                    // Add character information as data attributes
                    if (cell.character) {
                        cellElement.dataset.name = cell.character.name;
                        cellElement.dataset.country = cell.character.country;
                        
                        // Add tooltip
                        cellElement.title = `${cell.character.name} (${cell.character.country})`;
                    }
                    
                    // Add click event
                    cellElement.addEventListener('click', () => {
                        if (cell.character) {
                            updateStatus(`Selected: ${cell.character.name} from ${cell.character.country}`);
                        }
                    });
                    
                    interactiveOverlay.appendChild(cellElement);
                });
            }
            
            // Helper function to update status display
            function updateStatus(message) {
                statusDisplay.textContent = message;
                console.log(message);
            }
        });
    </script>
